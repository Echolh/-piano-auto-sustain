name: Piano Auto Sustain 1.0 cross-platform
on:
  workflow_dispatch:
  push:
    branches: [piano-auto-sustain-1.0-build]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macOS-Universal
          - os: ubuntu-22.04
            platform: Linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: piano-auto-sustain
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev xvfb
      - name: Configure
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            cmake -S . -B build -G Xcode -DBUILD_PLUGIN=ON -DBUILD_NATIVE_MIDI_PROBE=OFF '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_PLUGIN=ON -DBUILD_NATIVE_MIDI_PROBE=OFF
          fi
      - name: Build
        run: |
          cmake --build build --config Release --parallel 3 --target BassPedal_VST3 vst3_processor_tests
          if [[ "$RUNNER_OS" == macOS ]]; then cmake --build build --config Release --parallel 3 --target BassPedalAU_AU; fi
      - name: Test
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a ctest --test-dir build -C Release -R '^(product_version|vst3_processor|vst3_scan)$' --output-on-failure
          else
            ctest --test-dir build -C Release -R '^(product_version|vst3_processor|vst3_scan)$' --output-on-failure
          fi
          python3 tests/PackagingTests.py
      - name: Check Mac architectures and sign locally
        if: runner.os == 'macOS'
        run: |
          for bundle in 'build/BassPedal_artefacts/Release/VST3/Piano Auto Sustain.vst3' 'build/BassPedalAU_artefacts/Release/AU/Piano Auto Sustain MIDI FX.component'; do
            binary=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundle/Contents/Info.plist")
            lipo "$bundle/Contents/MacOS/$binary" -verify_arch arm64 x86_64
            codesign --force --deep --sign - "$bundle"
            codesign --verify --deep --strict "$bundle"
          done
      - name: Validate AU
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          ditto 'build/BassPedalAU_artefacts/Release/AU/Piano Auto Sustain MIDI FX.component' "$HOME/Library/Audio/Plug-Ins/Components/Piano Auto Sustain MIDI FX.component"
          auval -v aumi Pam1 Amup
      - name: Package
        run: python3 scripts/package_portable.py --build build --output dist --platform '${{ matrix.platform }}' --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: Piano-Auto-Sustain-1.0-${{ matrix.platform }}
          path: piano-auto-sustain/dist/*
          if-no-files-found: error
          retention-days: 30
