name: Piano Auto Sustain 1.0 macOS build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-macos:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          cmake -S . -B build -G Xcode \
            -DBUILD_PLUGIN=ON \
            -DBUILD_NATIVE_MIDI_PROBE=OFF \
            '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build
        run: |
          cmake --build build --config Release --parallel 3 \
            --target BassPedal_VST3 BassPedalAU_AU vst3_processor_tests
      - name: Test
        run: |
          ctest --test-dir build -C Release \
            -R '^(product_version|vst3_processor|vst3_scan)$' \
            --output-on-failure
          python3 tests/PackagingTests.py
      - name: Verify architectures and ad-hoc sign
        run: |
          for bundle in \
            'build/BassPedal_artefacts/Release/VST3/Piano Auto Sustain.vst3' \
            'build/BassPedalAU_artefacts/Release/AU/Piano Auto Sustain MIDI FX.component'
          do
            binary=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundle/Contents/Info.plist")
            lipo "$bundle/Contents/MacOS/$binary" -verify_arch arm64 x86_64
            codesign --force --deep --sign - "$bundle"
            codesign --verify --deep --strict "$bundle"
          done
      - name: Validate AU
        run: |
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          ditto 'build/BassPedalAU_artefacts/Release/AU/Piano Auto Sustain MIDI FX.component' \
            "$HOME/Library/Audio/Plug-Ins/Components/Piano Auto Sustain MIDI FX.component"
          auval -v aumi Pam1 Amup
      - name: Package
        run: python3 scripts/package_portable.py \
          --build build --output dist --platform macOS-Universal --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: Piano-Auto-Sustain-1.0-macOS-Universal
          path: dist/*
          if-no-files-found: error
          retention-days: 30
